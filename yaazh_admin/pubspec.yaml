name: yaazh_admin
description: Yaazh Cabs admin mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  google_fonts: ^6.2.1
  flutter_easyloading: ^3.0.5
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.19.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  image: ^4.5.4
  http_parser: ^4.0.2
  line_awesome_flutter: ^3.0.1
  flutter_dotenv: ^6.0.1
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.1.0
  firebase_performance: ^0.11.1
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - .env
    - assets/img/app-logo-admin.png
